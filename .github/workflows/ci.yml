name: CI Pipeline

# Trigger CI on pushes and PRs to main and dev branches
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  # Backend test job (FastAPI)
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Run all backend commands from the backend directory
        working-directory: ./backend

    #get OPENTDB_URL from repository variables
    env:
      OPENTDB_URL: ${{ vars.OPENTDB_URL }}

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
      # Execute backend unit tests
      - name: Run Backend Tests
        run: pytest

  # Frontend test job (React)
  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Run all frontend commands from the frontend directory
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install Dependencies
        run: npm ci
        # Execute frontend test suite
      - name: Run Frontend Tests
        run: npm test